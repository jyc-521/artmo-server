# 작품 수집을 GitHub Actions에서 실행한다. 키는 저장소 Secrets에만 두고, 코드·로그·채팅에는 남기지 않는다.
# 실행: GitHub > Actions > "Collect artworks" > Run workflow (처음엔 dry_run=true로 확인)
name: Collect artworks

on:
  workflow_dispatch:
    inputs:
      per:
        description: "미술관별 목표 작품 수"
        default: "500"
        required: true
      dry_run:
        description: "true면 저장하지 않고 결과만 출력"
        type: boolean
        default: true
      museums:
        description: "met, aic 또는 met,aic (시카고 이미지는 GitHub에서 403으로 막힘)"
        default: "met"
        required: true
      model:
        description: "태깅 모델 (비우면 gemini-3.5-flash)"
        default: "gemini-3.1-flash-lite"
        required: false

permissions:
  contents: read

concurrency:
  group: collect-artworks
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_TAGGING: ${{ inputs.model }}
          PER: ${{ inputs.per }}
          DRY_RUN: ${{ inputs.dry_run }}
          MUSEUMS: ${{ inputs.museums }}
        run: |
          case "$GEMINI_MODEL_TAGGING" in ''|gemini-[a-z0-9.-]*) ;; *) echo "모델 이름 형식이 아닙니다"; exit 1;; esac
          case "$MUSEUMS" in met|aic|met,aic|aic,met) ;; *) echo "museums는 met, aic, met,aic 중 하나"; exit 1;; esac
          case "$PER" in ''|*[!0-9]*) echo "per는 숫자만 넣으세요"; exit 1;; esac
          if [ "$DRY_RUN" = "true" ]; then
            npm run collect:artworks -- --per "$PER" --museums "$MUSEUMS" --dry-run
          else
            npm run collect:artworks -- --per "$PER" --museums "$MUSEUMS"
          fi
